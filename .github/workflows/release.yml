name: Release (pre-release, unsigned)

# Builds installers and attaches them to a GitHub **pre-release**.
#
# Everything this produces is UNSIGNED and UNTESTED, on purpose:
#
#   * Windows has no code-signing certificate (app/electron-builder.yml says so in as many
#     words), so SmartScreen will warn. The release notes tell the tester how to get past it
#     rather than leaving them to guess.
#   * macOS notarization is switched OFF here. The repo config sets `notarize: true` because
#     that is what a real release needs, and a build without APPLE_ID credentials would
#     simply fail — so this workflow overrides it and Gatekeeper will warn instead.
#
# Both are marked pre-release so nobody mistakes a test build for a shipped one.
#
# WHY THIS WORKFLOW EXISTS AT ALL: `scripts/stage-sidecar.mjs` branches on
# `platform() === 'win32'` — the HOST platform, not a target — so the Python venv it builds
# is always for the machine it runs on. A Windows installer therefore cannot be produced from
# a Mac, and this is the only way to get one without owning a Windows box.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the pre-release, e.g. v0.1.0-rc1"
        required: true
        default: v0.1.0-rc1
      voice:
        description: "Include the voice extra (pipecat, faster-whisper, Kokoro). Without it there is no Listening audio, no live speaking and no speech-to-text."
        type: boolean
        default: true
      publish:
        description: "Attach the installers to a GitHub pre-release. Off for a trial run: the build and the launch check still happen, and nothing appears on the Releases page."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The venv install and the electron-builder pack are both slow, and the voice extra adds
    # a few hundred megabytes of wheels on top.
    timeout-minutes: 60
    strategy:
      # One broken platform must still produce the other installer — a tester waiting on
      # Windows should not be blocked by a macOS problem.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows (x64)
            builder: --win
            artifact: windows
          # Apple Silicon only. stage-sidecar copies the HOST's Python, so an x64 DMG made
          # here would carry an arm64 interpreter: it installs on an Intel Mac and then cannot
          # start its sidecar. The targets are named with their arch (`dmg:arm64`) because
          # electron-builder.yml lists both arches and a bare `--arm64` flag still built the
          # x64 DMG. There is no Intel build on an Intel runner either: pipecat-ai 1.5 needs
          # onnxruntime >= 1.24.3, which publishes no macOS x86_64 wheels.
          - os: macos-15
            name: macos (arm64)
            builder: --mac dmg:arm64 zip:arm64
            artifact: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack and pin pnpm
        # Must match `packageManager` in the root package.json.
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Set up Python 3.11
        # stage-sidecar reuses uv's own python-build-standalone copy, which is exactly the
        # relocatable tree the bundle needs.
        run: uv python install 3.11

      - name: Install node dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Build the renderer bundle
        run: pnpm --filter bandready-app build

      - name: Build the main and preload bundles
        run: node scripts/build-electron.mjs

      - name: Stage the Python interpreter and sidecar venv
        # Produces build/python/ and build/sidecar-venv/, which electron-builder maps into
        # the bundle and nothing else creates.
        run: node scripts/stage-sidecar.mjs ${{ github.event.inputs.voice == 'true' && '--voice' || '' }}

      - name: Package the installer
        working-directory: app
        # bash on every runner: PowerShell splits a native argument like
        # `-c.mac.notarize=false` at the dot, and electron-builder then tried to open
        # `.mac.notarize=false` as a config file.
        shell: bash
        env:
          # A pre-release is not notarized: the credentials do not exist here, and a build
          # that tried would fail rather than degrade.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # macOS: ad-hoc signed by scripts/adhoc-sign-mac.cjs (the config's afterSign hook)
          # rather than left unsigned. See that file for why an unsigned Apple Silicon
          # download cannot be opened at all. The hardened runtime is for notarization and is
          # left off without it.
          BANDREADY_ADHOC_SIGN: "1"
        run: >-
          pnpm exec electron-builder --config electron-builder.yml ${{ matrix.builder }}
          --publish never -c.mac.notarize=false -c.mac.identity=null -c.mac.hardenedRuntime=false

      - name: Install and launch the Windows build
        # A green package step only proves electron-builder wrote a file. This installs the
        # .exe the way a learner would, starts the app, and waits for the main process to log
        # that the sidecar answered /health. That is the step that has never been seen to
        # pass on Windows.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-electron -Filter 'BandReady-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS installer was built' }
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/S', '/D=C:\BR' -Wait -PassThru
          Write-Host "Installer exited with code $($installer.ExitCode)"
          # NSIS can hand the work to a child process and exit first. One release run found
          # no BandReady.exe four seconds in, where the install normally takes about ninety.
          # Wait for the files, and for the uninstaller NSIS writes last, before judging.
          for ($i = 0; $i -lt 180; $i++) {
            $done = (Test-Path 'C:\BR\BandReady.exe') -and (Get-ChildItem 'C:\BR' -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue)
            if ($done -and -not (Get-Process -Name 'BandReady-Setup*' -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path 'C:\BR\BandReady.exe')) {
            Get-ChildItem 'C:\BR' -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
            throw 'the installer did not produce C:\BR\BandReady.exe'
          }

          # Windows still caps paths at 260 characters unless a registry switch is on, and a
          # per-user install lives under C:\Users\<name>\AppData\Local\Programs\BandReady\
          # (about 60 characters for a typical name). Python's site-packages nests deeply.
          $longest = (Get-ChildItem 'C:\BR' -Recurse -File | ForEach-Object { $_.FullName.Length - 'C:\BR\'.Length } | Measure-Object -Maximum).Maximum
          Write-Host "Longest path inside the install directory: $longest characters (about $($longest + 60) under a typical per-user install)"
          if ($longest + 60 -ge 260) { Write-Host "::warning::An install path over 260 characters will break on Windows machines without long paths enabled" }

          if ('${{ github.event.inputs.voice }}' -eq 'true') {
            # /health does not touch the voice stack, so load it the way the app will.
            $env:PYTHONPATH = 'C:\BR\resources\sidecar-venv\Lib\site-packages'
            & 'C:\BR\resources\python\python.exe' -s -c "import pipecat, faster_whisper, onnxruntime, ctranslate2, kokoro_onnx; print('voice stack imports')"
            if ($LASTEXITCODE -ne 0) { throw 'the installed voice stack does not import' }
            Remove-Item Env:PYTHONPATH
          }

          $log = Join-Path $env:APPDATA 'BandReady\logs\sidecar.log'
          $app = Start-Process -FilePath 'C:\BR\BandReady.exe' -PassThru
          $healthy = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'healthy on' -Quiet)) { $healthy = $true; break }
            if ($app.HasExited) { Write-Host "The app exited with code $($app.ExitCode)"; break }
          }
          if (Test-Path $log) { Get-Content $log -Tail 120 } else { Write-Host "No sidecar log at $log" }
          Get-Process BandReady, python -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $healthy) { throw 'the installed app never reported a healthy sidecar' }

      - name: Install and launch the macOS build
        # The same check from the DMG. It also verifies the bundle's signature: an Apple
        # Silicon app with a broken seal does not get Gatekeeper's "Open Anyway". Once it is
        # downloaded through a browser, macOS calls it damaged and offers only the Trash.
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist-electron/*.dmg | head -1)
          [ -n "$dmg" ] || { echo "::error::no DMG was built"; exit 1; }
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/dmg/BandReady.app" "$RUNNER_TEMP/BandReady.app"
          hdiutil detach "$RUNNER_TEMP/dmg"

          codesign -dv "$RUNNER_TEMP/BandReady.app" 2>&1 | head -6
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/BandReady.app"

          if [ "${{ github.event.inputs.voice }}" = "true" ]; then
            # /health does not touch the voice stack, so load it the way the app will.
            "$RUNNER_TEMP/BandReady.app/Contents/Resources/sidecar-venv/bin/python" -s -c \
              "import pipecat, faster_whisper, onnxruntime, ctranslate2, kokoro_onnx; print('voice stack imports')"
          fi

          log="$HOME/Library/Application Support/BandReady/logs/sidecar.log"
          "$RUNNER_TEMP/BandReady.app/Contents/MacOS/BandReady" &
          pid=$!
          healthy=0
          for _ in $(seq 120); do
            sleep 2
            if grep -q 'healthy on' "$log" 2>/dev/null; then healthy=1; break; fi
            kill -0 "$pid" 2>/dev/null || { echo "The app exited"; break; }
          done
          tail -120 "$log" 2>/dev/null || echo "No sidecar log at $log"
          kill "$pid" 2>/dev/null || true
          pkill -f 'BandReady.app' || true
          [ "$healthy" = 1 ] || { echo "::error::the installed app never reported a healthy sidecar"; exit 1; }

      - name: List what was built
        shell: bash
        run: ls -lh dist-electron/*.dmg dist-electron/*.exe dist-electron/*.msi dist-electron/*.zip 2>/dev/null || ls -lh dist-electron

      - uses: actions/upload-artifact@v4
        with:
          name: bandready-${{ matrix.artifact }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.msi
            dist-electron/*.zip
          if-no-files-found: error
          # These exist to hand the build to the publish job, which attaches them to the
          # release. The default 90 days keeps a second copy of every installer for three
          # months and is what exhausted the storage quota.
          retention-days: 3

  browser:
    # The browser edition: one wheel holding the sidecar, the built pages and the content
    # pack, installed by install.sh / install.ps1 for Linux and anyone the desktop
    # installers do not suit. Checked here exactly as a learner would run it.
    name: browser edition (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the renderer bundle
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter bandready-app build

      - name: Build the wheel with the pages and the content pack inside
        run: |
          mkdir -p sidecar/bandready/_bundle/content
          cp -R app/dist sidecar/bandready/_bundle/web
          cp -R content/core-en sidecar/bandready/_bundle/content/core-en
          cd sidecar && uv build --wheel
          ls -lh dist

      - name: Install with install.sh and open the app
        run: |
          export BANDREADY_WHEEL="$(ls "$PWD"/sidecar/dist/*.whl)"
          BANDREADY_NO_LAUNCH=1 sh install.sh
          test -f "$HOME/.local/share/applications/bandready.desktop"
          "$(uv tool dir --bin)/bandready" --no-browser --port 8765 > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 180); do
            curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1 && break
            sleep 1
          done
          cat "$RUNNER_TEMP/web.log"
          # Without the launch secret the page must not carry the token.
          if curl -sS http://127.0.0.1:8765/ | grep -q 'var t="'; then
            echo "::error::the page gave the token to a request without the launch secret"; exit 1
          fi
          # The way the browser gets in: the secret from the owner-only state file.
          state="$HOME/.local/share/BandReady/web.json"
          [ "$(stat -c %a "$state")" = 600 ] || { echo "::error::web.json is readable by others"; exit 1; }
          secret=$(jq -r .launch "$state")
          curl -fsS "http://127.0.0.1:8765/?launch=$secret" -o "$RUNNER_TEMP/index.html"
          token=$(sed -n 's/.*var t="\([0-9a-f]*\)".*/\1/p' "$RUNNER_TEMP/index.html")
          [ -n "$token" ] || { echo "::error::the page carries no token after the launch exchange"; exit 1; }
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8765/api/v1/reading/tests | head -c 300
          echo
          "$(uv tool dir)/bandready-sidecar/bin/python" -c "import pipecat, faster_whisper, onnxruntime, ctranslate2, kokoro_onnx; print('voice stack imports')"

      - uses: actions/upload-artifact@v4
        with:
          name: bandready-browser
          path: sidecar/dist/*.whl
          if-no-files-found: error
          retention-days: 3

  browser-windows:
    # install.ps1 under Windows PowerShell 5.1, the version every Windows machine has.
    name: browser edition (windows)
    needs: browser
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bandready-browser
          path: wheel

      - name: Install with install.ps1 and open the app
        shell: powershell
        run: |
          $env:BANDREADY_WHEEL = (Get-ChildItem wheel -Filter *.whl | Select-Object -First 1).FullName
          $env:BANDREADY_NO_LAUNCH = '1'
          .\install.ps1
          $programs = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path (Join-Path $programs 'BandReady.lnk'))) { throw 'no Start menu shortcut' }
          $bin = Join-Path ((& "$env:USERPROFILE\.local\bin\uv.exe" tool dir --bin).Trim()) 'bandready.exe'
          if (-not (Test-Path $bin)) { $bin = Join-Path ((& uv tool dir --bin).Trim()) 'bandready.exe' }
          Start-Process -FilePath $bin -ArgumentList '--no-browser', '--port', '8765' -RedirectStandardOutput "$env:RUNNER_TEMP\web.log" -RedirectStandardError "$env:RUNNER_TEMP\web.err"
          $up = $false
          for ($i = 0; $i -lt 180; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:8765/health -UseBasicParsing | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          Get-Content "$env:RUNNER_TEMP\web.log", "$env:RUNNER_TEMP\web.err" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $up) { throw 'the browser edition never answered /health' }
          $state = Get-Content (Join-Path $env:APPDATA 'BandReady\web.json') -Raw | ConvertFrom-Json
          $page = (Invoke-WebRequest "http://127.0.0.1:8765/?launch=$($state.launch)" -UseBasicParsing).Content
          if ($page -notmatch 'var t="([0-9a-f]+)"') { throw 'the page carries no token after the launch exchange' }
          $tests = Invoke-RestMethod http://127.0.0.1:8765/api/v1/reading/tests -Headers @{ Authorization = "Bearer $($Matches[1])" }
          Write-Host "reading tests served: $($tests.items.Count)"
          if ($tests.items.Count -lt 1) { throw 'no content was served' }

  publish:
    name: attach to a pre-release
    needs: [build, browser, browser-windows]
    # `always()` so one platform failing still publishes the other — see fail-fast above.
    # Skipped entirely for a trial run.
    if: always() && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what will be attached
        # Both platforms failing used to publish a pre-release with nothing attached.
        run: |
          find artifacts -type f -exec ls -lh {} \;
          [ -n "$(find artifacts -type f 2>/dev/null)" ] || { echo "::error::no installer was built, so there is nothing to publish"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }} — untested pre-release
          prerelease: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
          body: |
            ## Untested pre-release — for testing only

            These installers are built straight from the repository. Each one was installed
            and started on a clean GitHub machine before it was attached here, but nobody has
            practised with them yet. They are not signed by a paid certificate, so your
            computer will warn you once. The steps below get past it.

            ### Windows

            Two installers, same app — take whichever your machine prefers:

            - **`BandReady-Setup-*.exe`** (NSIS) — the normal one.
            - **`BandReady-*-x64.msi`** — use this if the `.exe` is blocked, or on a managed
              or locked-down machine that only accepts MSI packages.

            Both are **unsigned**, so SmartScreen will say *"Windows protected your PC"*
            either way. The format changes what will install it, not whether Windows warns.

            To run it anyway: click **More info**, then **Run anyway**.

            ### macOS

            **`BandReady-*-arm64.dmg`**, for Apple Silicon Macs (M1 and later). There is no
            Intel Mac build: the speech engine it depends on no longer supports Intel Macs.

            The app is not notarized by Apple, so macOS refuses it the first time. Open the
            DMG, drag BandReady to Applications and open it once. Then open **System Settings
            → Privacy & Security**, scroll to the message about BandReady, and click **Open
            Anyway**. Right-click → Open no longer works on macOS 15 and later.

            ### Linux, Intel Macs, or if an installer is blocked

            Use the browser edition: the same app, opened in your browser, still running on
            your own computer. Paste one line:

            - Linux or Mac (Terminal): `curl -LsSf https://raw.githubusercontent.com/Luxshan2000/ielts-prep/main/install.sh | sh`
            - Windows (PowerShell): `irm https://raw.githubusercontent.com/Luxshan2000/ielts-prep/main/install.ps1 | iex`

            It installs the `.whl` attached here. You do not need to download it yourself.

            ### What may not work

            - **Model files are not bundled.** The examiner's voice (about 340 MB) and speech
              recognition (about 145 MB) download from Settings the first time, so the first
              session needs a connection and some patience.
            - **Marking needs a model**: either Ollama on this computer (free) or an
              OpenRouter key. The setup wizard walks through both.

            Please report what breaks. That is the point of this build.
