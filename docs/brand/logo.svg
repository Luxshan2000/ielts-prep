<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IELTS Prep">
  <!--
    The full lockup: a capital I wearing a mortarboard, followed by ELTS at a third of its
    weight. The exam name is the mark, and the I carries the cap because it is the only
    letter with a flat top to put one on.

    Use this above about 64px only. Below that the ELTS strokes fall under a pixel and turn
    to grey mush — favicon.svg is the same family drawn as the capped I alone, and
    favicon-small.svg drops the tassel too. Three drawings, one idea, each legible at the
    size it is for.

    Geometry worth not breaking. ELTS sits on the I's baseline (y=51) so the word reads as
    one word rather than a monogram beside a label. The gap between the I's bottom serif
    (x=26) and the E (x=30) is four units, which is what stops them fusing at 64px. The
    tassel ball clears the E by enough that the two never touch.

    The teal is the `primary` token at its light value. It is hard-coded here and in
    Logo.tsx for the same reason: a logo is one fixed thing, not a themed one.
  -->
  <rect width="64" height="64" rx="10" fill="#158475"/>
  <g fill="#ffffff">
    <path d="M17.5 11 L32.5 16 L17.5 21 L2.5 16 Z"/>
    <path d="M31.3 16.4 V22.4" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <circle cx="31.3" cy="24.3" r="2"/>
    <path d="M9 24 H26 V28.2 H19.6 V46.8 H26 V51 H9 V46.8 H15.4 V28.2 H9 Z"/>
    <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="square" fill="none">
      <path d="M31.1 39.1 H35.9 M31.1 44.5 H34.9 M31.1 49.9 H35.9 M31.1 38 V51"/>
      <path d="M38.6 38 V51 M38.6 49.9 H43.4"/>
      <path d="M45.6 39.1 H51.4 M48.5 39.1 V51"/>
      <path d="M57.4 40.1 C57.4 38.7 56.1 38 54.6 38 C53 38 51.8 38.9 51.8 40.4
               C51.8 43.6 57.6 43.2 57.6 47.4 C57.6 49.7 56 51 54.2 51
               C52.5 51 51.3 50.2 51 48.9"/>
    </g>
  </g>
</svg>
