# Alembic configuration for the BandReady sidecar.
#
# There is deliberately NO sqlalchemy.url here: the database lives under the runtime data dir
# (BANDREADY_DATA_DIR, passed by the Electron main process), so migrations/env.py resolves the
# connection from bandready.db.engine instead. This file only exists for `alembic` CLI use from
# the sidecar/ directory; the app itself calls bandready.db.engine.run_migrations().

[alembic]
script_location = bandready/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
