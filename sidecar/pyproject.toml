[project]
name = "bandready-sidecar"
version = "0.1.0"
description = "BandReady sidecar: local API, voice pipeline, scoring and content engine"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luxshan Thavarasa" }]
keywords = ["ielts", "offline-first", "fastapi", "speech", "education"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.35",
  "alembic>=1.14",
  "cryptography>=43",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "python-ulid>=3.0",
  "websockets>=13",
  "fsrs>=4.0",
  "wn>=0.9.5",
  "soundfile>=0.12",
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/Luxshan2000/bandready"
Repository = "https://github.com/Luxshan2000/bandready"
Issues = "https://github.com/Luxshan2000/bandready/issues"

[project.optional-dependencies]
voice = [
  "pipecat-ai[silero,webrtc,openai,whisper,kokoro]==1.5.0",
  "faster-whisper>=1.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "anyio>=4.6",
]

[project.scripts]
bandready-sidecar = "bandready.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandready"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
